[package]
name = "RedThreadGame"
version = "0.1.0"
edition = "2024"

[dependencies]
glam = "0.31.0"
bevy = { version = "0.18", default-features = true, features = ["vorbis"] }
bevy_procedural_tilemaps = "0.2.0"
noise = "0.9"
rand = "0.9.2"
bevy_rapier2d = { version = "0.34.0", features = ["simd-stable", "debug-render-2d"]}

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3